

name: Build Khyber Supermarket APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Khyber-Supermarket-PlayStore-Preparation-v2.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q Khyber-Supermarket-PlayStore-Preparation-v2.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fix Java Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/kh_play_edit/app/build.gradle.kts")
          s = p.read_text()
          s += """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project/kh_play_edit
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Khyber-Supermarket-APK
          path: project/kh_play_edit/app/build/outputs/apk/debug/*.apk
