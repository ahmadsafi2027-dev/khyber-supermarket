
name: Build Khyber Supermarket APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Khyber-Supermarket-PlayStore-Preparation-v2.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q Khyber-Supermarket-PlayStore-Preparation-v2.zip -d project
          find project -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project/kh_play_edit
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khyber-Supermarket-APK
          path: project/kh_play_edit/app/build/outputs/apk/debug/*.apk
